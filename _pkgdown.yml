url: https://yousa-mirage.github.io/jiebaRS/

template:
  bootstrap: 5
  bslib:
    primary: "#40A2B4"
    line-height-base: 1.7

toc:
  depth: 3

redirects:
  - ["README.html", "index.html"]

authors:
  Hao Cheng:
    href: https://github.com/Yousa-Mirage
    html: Yousa Mirage

home:
  title: Chinese text segmentation, POS tagging, and keyword extraction for R
  sidebar:
    structure: [links, license, community, citation, authors, toc, dev]

navbar:
  structure:
    left: [guide_zh, guide_en, reference, news]
    right: [search, github]
  components:
    guide_zh:
      text: 使用指南
      href: ./
    guide_en:
      text: User Guide
      href: README_en.html
    github:
      icon: fab fa-github
      href: https://github.com/Yousa-Mirage/jiebaRS
      aria-label: GitHub

reference:
  - title: Workers
    desc: Create and configure jiebaRS workers.
    contents:
      - worker
  - title: Segmentation
    desc: Segment Chinese text into tokens.
    contents:
      - segment
      - segment_batch
  - title: Part-of-Speech Tagging
    desc: Tag segmented text with part-of-speech labels.
    contents:
      - tagging
      - tagging_batch
  - title: Keyword Extraction
    desc: Extract keywords with TF-IDF and TextRank.
    contents:
      - keywords
      - keywords_df
      - textrank
      - textrank_df
      - get_idf
  - title: User Dictionaries
    desc: Add, import, and inspect custom dictionaries.
    contents:
      - new_user_word
      - import_cidian
      - read_cidian
  - title: Token Utilities
    desc: Filter tokens and calculate frequencies or n-grams.
    contents:
      - filter_segment
      - freq
      - count_ngrams
  - title: Built-in Data
    contents:
      - stopwords
